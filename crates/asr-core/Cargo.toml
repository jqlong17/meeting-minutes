[package]
name = "asr-core"
version = "0.1.0"
edition = "2021"
description = "SenseVoice local ASR engine for Meetloom"

[dependencies]
anyhow = "1.0"
half = "2.4"
hound = "3.5"
kaldi-native-fbank = "0.1"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.12", features = ["ndarray", "half"] }
realfft = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
directories = "5.0"
