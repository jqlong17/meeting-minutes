[package]
name = "meetloom-asr"
version = "0.1.0"
edition = "2021"
description = "Meetloom ASR service daemon and CLI"

[[bin]]
name = "meetloom-asr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
asr-core = { path = "../asr-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
